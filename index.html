<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="তুহিন ফকির - ব্যক্তিগত প্রোফাইল পৃষ্ঠা">
    <title>তুহিন ফকির - প্রোফাইল</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profile-section {
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            font-size: 50px;
        }

        .name {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .info-card {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .info-label {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .facebook-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            width: 100%;
        }

        .facebook-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .facebook-btn:active {
            transform: translateY(0);
        }

        .facebook-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .name {
                font-size: 24px;
            }

            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
                margin-bottom: 20px;
            }

            .facebook-btn {
                padding: 12px 30px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .name {
                font-size: 22px;
            }

            .profile-avatar {
                width: 90px;
                height: 90px;
                font-size: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ব্যবহারকারী প্রোফাইল তথ্য</h1>
        </div>

        <div class="profile-section">
            <div class="profile-avatar">👤</div>
            <div class="name">তুহিন ফকির</div>
            <div class="subtitle">ব্যক্তিগত প্রোফাইল</div>
        </div>

        <div class="info-card">
            <div class="info-label">ফেসবুক প্রোফাইল</div>
            <div class="info-value">তুহিন ফকির</div>
        </div>

        <a href="https://www.facebook.com/share/1AanpXLghA/" target="_blank" rel="noopener noreferrer" class="facebook-btn">
            <span class="facebook-icon">f</span>ফেসবুক প্রোফাইল দেখুন
        </a>

        <footer class="footer">
            🔒 ব্যক্তিগত প্রোফাইল
        </footer>
    </div>
</body>
</html>
