<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="তুহিন ফকির - ব্যক্তিগত প্রোফাইল পৃষ্ঠা">
    <title>তুহিন ফকির - প্রোফাইল</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-info {
            font-size: 13px;
            color: #666;
        }

        .logout-btn {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profile-section {
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            font-size: 50px;
        }

        .name {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .info-card {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .info-label {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .facebook-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            width: 100%;
        }

        .facebook-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .facebook-btn:active {
            transform: translateY(0);
        }

        .facebook-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(102, 126, 234, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            text-align: left;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .name {
                font-size: 24px;
            }

            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
                margin-bottom: 20px;
            }

            .facebook-btn {
                padding: 12px 30px;
                font-size: 15px;
            }

            .top-nav {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .name {
                font-size: 22px;
            }

            .profile-avatar {
                width: 90px;
                height: 90px;
                font-size: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <div class="user-info">
                👤 <span id="userEmail">Loading...</span>
            </div>
            <button class="logout-btn" id="logoutBtn">লগআউট</button>
        </div>

        <div id="errorContainer"></div>

        <div id="profileContent" style="display: none;">
            <div class="header">
                <h1>ব্যবহারকারী প্রোফাইল তথ্য</h1>
            </div>

            <div class="profile-section">
                <div class="profile-avatar">👤</div>
                <div class="name">তুহিন ফকির</div>
                <div class="subtitle">ব্যক্তিগত প্রোফাইল</div>
            </div>

            <div class="info-card">
                <div class="info-label">ফেসবুক প্রোফাইল</div>
                <div class="info-value">তুহিন ফকির</div>
            </div>

            <a href="https://www.facebook.com/share/1AanpXLghA/" target="_blank" rel="noopener noreferrer" class="facebook-btn">
                <span class="facebook-icon">f</span>ফেসবুক প্রোফাইল দেখুন
            </a>

            <footer class="footer">
                🔒 ব্যক্তিগত প্রোফাইল
            </footer>
        </div>

        <div id="loadingContent" class="loading">
            <div class="loading-spinner"></div>
            <p>লোড হচ্ছে...</p>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = localStorage.getItem('supabase_url') || '';
        const SUPABASE_ANON_KEY = localStorage.getItem('supabase_anon_key') || '';

        const profileContent = document.getElementById('profileContent');
        const loadingContent = document.getElementById('loadingContent');
        const errorContainer = document.getElementById('errorContainer');
        const userEmailSpan = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
            loadingContent.style.display = 'none';
            errorContainer.innerHTML = '<div class="error-message">⚠️ Supabase configuration not found. Please set up your Supabase credentials first.</div>';
        } else {
            const { createClient } = window.supabase;
            const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Check authentication status
            async function checkAuth() {
                const { data: { session } } = await supabase.auth.getSession();

                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                // Show profile content
                loadingContent.style.display = 'none';
                profileContent.style.display = 'block';
                userEmailSpan.textContent = session.user.email;
            }

            // Handle logout
            logoutBtn.addEventListener('click', async () => {
                logoutBtn.disabled = true;
                logoutBtn.textContent = 'লগআউট হচ্ছে...';

                const { error } = await supabase.auth.signOut();

                if (error) {
                    console.error('Logout error:', error);
                    errorContainer.innerHTML = '<div class="error-message">❌ লগআউট ব্যর্থ। আবার চেষ্টা করুন।</div>';
                    logoutBtn.disabled = false;
                    logoutBtn.textContent = 'লগআউট';
                } else {
                    window.location.href = 'login.html';
                }
            });

            // Check auth on page load
            checkAuth();
        }
    </script>
</body>
</html>
